<!DOCTYPE html>
<html>
    <head>
        <title>Conjetura de Collatz</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h1>Form with Conjetura de Collatz</h1>
        <form action="/collatz">
            <label for="number">Number:</label><br>
            <input type="text" id="number" name="number" value=10><br><br>
            <input type="button" value="Submit" onclick="loadGetMsg()">
        </form>
        <div id="getrespmsg"></div>
        <script>
            function loadGetMsg() {
            let numberVar = document.getElementById("number").value;
            const xhttp = new XMLHttpRequest();
            xhttp.onload = function() {
            document.getElementById("getrespmsg").innerHTML =
            this.responseText;
            }
            xhttp.open("GET", "/redirectmathservice?number="+numberVar);
            xhttp.send();
            }
        </script>
    </body>
</html>
